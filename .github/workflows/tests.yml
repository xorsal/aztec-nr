name: Tests

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  noir-tests:
    name: Noir Tests
    runs-on: ubuntu-latest-m
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Aztec environment
        uses: defi-wonderland/aztec-ci-actions/actions/setup-aztec@v0
        with:
          start-pxe: "false"
          run-compile: "false"
          run-codegen: "false"

      - name: Compile test contracts
        run: |
          aztec compile --package composition_multi_contract
          aztec compile --package composition_transitive_contract
          aztec compile --package composition_host_contract
          aztec compile --package composition_override_contract
          aztec compile --package composition_diamond_transitive_contract
          aztec compile --package storage_merge_basic_contract
          aztec compile --package storage_merge_pure_mixin_contract
          aztec compile --package storage_merge_dedup_contract
          aztec compile --package storage_merge_multi_contract
          aztec compile --package storage_merge_transitive_contract
          aztec compile --package storage_merge_diamond_contract
          aztec compile --package ownable_pausable_counter_contract
          aztec compile --package storage_merge_three_way_contract

      - name: Run Noir tests
        run: |
          aztec test --package composition_multi_contract
          aztec test --package composition_transitive_contract
          aztec test --package composition_host_contract
          aztec test --package composition_override_contract
          aztec test --package composition_diamond_transitive_contract
          aztec test --package storage_merge_basic_contract
          aztec test --package storage_merge_pure_mixin_contract
          aztec test --package storage_merge_dedup_contract
          aztec test --package storage_merge_multi_contract
          aztec test --package storage_merge_transitive_contract
          aztec test --package storage_merge_diamond_contract
          aztec test --package ownable_pausable_counter_contract
          aztec test --package storage_merge_three_way_contract

  compilation-failure-tests:
    name: Compilation Failure Tests
    runs-on: ubuntu-latest-m
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Aztec environment
        uses: defi-wonderland/aztec-ci-actions/actions/setup-aztec@v0
        with:
          start-pxe: "false"
          run-compile: "false"
          run-codegen: "false"

      - name: Run macro compilation failure tests
        run: ./macro_compilation_failure_tests/assert_macro_compilation_failure.sh
        env:
          NARGO: nargo

      - name: Run composition compilation failure tests
        run: ./composition_failure_tests/assert_composition_failure.sh
        env:
          NARGO: nargo
